[toolchain]
anchor_version = "1.0.0"
solana_version = "3.1.8"

[features]
resolution = true
skip-lint = false

[programs.localnet]
mock_pyth = "HNTsMwJPumoJfcbv2jwjCwGQJCZqFoFRS6ap9qXcKT6V"
synthetic_exposure = "ABQ6gmEnvjn8iUKz7PBBL7Mk5paXCmxHxsCPAYZq9SUe"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Tests are Rust integration tests that run against a LiteSVM instance
# with the freshly-built .so files baked in via `include_bytes!`. This
# matches the program-examples-litesvm canonical pattern. No live
# validator, no Codama client generation, no TypeScript toolchain — the
# test command is a plain `cargo test` invocation. `anchor test` runs
# `anchor build` first, producing `target/deploy/*.so`, then this script.
test = "cargo test"

[hooks]
